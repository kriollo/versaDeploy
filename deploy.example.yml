# versaDeploy Configuration Example
# This file defines how and where your application is deployed.

# Unique project identifier (used for organizing logs and releases)
project: "my-awesome-app"

environments:
  # You can define multiple environments like 'production', 'staging', etc.
  production:
    ssh:
      host: "1.2.3.4"          # Server IP or hostname
      user: "deploy"           # SSH user
      key_path: "~/.ssh/id_rsa" # Path to private key (~/ is expanded on every OS)
      port: 22                 # SSH port (default 22)
      # known_hosts_file: "~/.ssh/known_hosts" # Host key verification (this is the default)
      # strict_host_key: true  # Refuse to connect if the host key can't be verified
      # use_ssh_agent: true    # Also try keys loaded in the SSH agent
      # legacy_algorithms: true # Only for very old servers (OpenSSH < 7, CentOS 5/6)

    # Absolute path on the server where the project will live.
    # Each release is stored in releases/<timestamp>/app and "current" points to the
    # active one, so the web root is e.g. /var/www/my-project/current/app/public
    remote_path: "/var/www/my-project"

    # FILES TO IGNORE: excluded from change detection and removed from the release
    # after building (builds still see them). Setting this replaces the defaults
    # (.git, tests, node_modules/.cache, vendor/bin).
    ignored_paths:
      - ".git"
      - ".github"
      - "tests"
      - "node_modules/.cache"
      - "vendor/bin"

    # BUILD ENGINES: versaDeploy can build your app locally before uploading
    builds:
      # PHP / Composer Settings
      php:
        enabled: true
        root: ""               # Subdirectory where composer.json is (optional)
        composer_command: "composer install --no-dev --optimize-autoloader"
        # Folders to reuse from previous release via hardlinks (speeds up deploy)
        reusable_paths: ["vendor"]

      # Frontend / Node Settings
      frontend:
        enabled: true
        root: "frontend"         # Example of building in a subdirectory
        npm_command: "pnpm install"
        compile_command: "pnpm run build"
        cleanup_dev_deps: true   # Remove node_modules after build and reinstall prod-only
        production_command: "pnpm install --prod"
        reusable_paths: ["node_modules", "dist"]
        # server_install: "npm ci --omit=dev"   # SSR apps (Next…): node_modules installed on the server

      # Go / Binary Settings
      go:
        enabled: false
        root: ""                 # Subdirectory where go.mod is (optional)
        deploy_path: "bin/go"    # Output directory inside each release
        target_os: "linux"
        target_arch: "amd64"
        binary_name: "my-service"

    # PERSISTENCE: Folders that should survive between releases
    shared_paths:
      - "storage/logs"         # Log files
      - "public/uploads"       # User uploaded content
      - ".env"                 # Environment configuration (create shared/.env on the server first)

    # IMMUTABILITY: Files copied from the previous release over the new one, so the
    # server's copy wins after the first deploy. Don't list a path that is also in
    # shared_paths (it would replace the shared symlink).
    preserved_paths:
      - "config.php"

    # HOOKS: Commands run at different stages of the deployment pipeline.
    #
    # pre_deploy_local: Local commands run before cloning (abort on failure)
    # pre_deploy_local:
    #   - "make test"
    #   - "go vet ./..."
    #
    # pre_deploy_server: Remote commands run before symlink switch (non-fatal warnings)
    # pre_deploy_server:
    #   - "sudo systemctl stop myapp || true"
    #
    # post_deploy: Remote commands run after symlink switch (rollback on failure)
    # Remote hooks run in <release>/app. Use a "parallel:" block to run several at once.
    # NOTE: $NAME / ${NAME} anywhere in this file is replaced with YOUR local environment
    # variables, hooks included. Write $$NAME for a variable of the server's shell
    # ("echo $$HOME" runs "echo $HOME" on the server). $1, $@, $? are left untouched.
    post_deploy:
      - "php versaCLI migrate:up"
      - parallel:
          - "php versaCLI cache:clear"
          - "php versaCLI route:cache"

    # on_failure: remote commands run in current/app after a failed deploy (non-fatal),
    # e.g. leave maintenance mode if an earlier hook entered it.
    # on_failure:
    #   - "php artisan up"

    # Only deploy commits with a matching git tag (production from versions):
    # deploy_tags: "v*"

    # SERVICES TO RELOAD after every deploy and rollback (critical for PHP-FPM OPcache!)
    # This runs AFTER the symlink switch but BEFORE post_deploy hooks.
    # For Apache + PHP-FPM: always include php-fpm reload to clear OPcache/realpath_cache.
    services_reload:
      - "sudo systemctl reload php8.2-fpm"
      # - "sudo systemctl reload apache2"
      # - "sudo systemctl reload nginx"

    # SERVICES: long-running processes (Go binary, Python server). versa installs them
    # in the server's init system (systemd, OpenRC or SysV /etc/init.d), enables them at
    # boot, restarts them after post_deploy on every deploy and rollback, and rolls the
    # deploy back if one doesn't stay up. Root installs them once per server:
    # `versa service production setup | ssh root@SERVER sh` (also writes the sudoers file).
    # services:
    #   - name: "my-service"
    #     exec: "./bin/go/my-service --port 8080" # "./" = <remote_path>/current. Default: the go
    #                                             # binary, or python's run_server.sh
    #     env_file: ".env"                        # <remote_path>/shared/.env
    #     environment:
    #       APP_ENV: "production"
    #     # user: "deploy"                        # default: ssh.user
    #     # working_dir: "app"                    # relative to current (default: app)
    #     # start_wait: 3                         # seconds before checking it's still running
    #     # stop_timeout: 30                      # seconds to shut down cleanly before SIGKILL

    # PROVISION (optional): server stack for the TUI "Services" view, which detects what is
    # installed, installs the selection (Debian/Ubuntu, RHEL/Rocky/Alma 8+), applies updates, shows security
    # alerts, logs and runs daily DB backups. Installing needs root: provision.ssh
    # overrides ssh (host/port/key are inherited). The view writes this block with "w";
    # db_password is never written, keep it as ${VAR}. See doc/SERVICES.md.
    # provision:
    #   ssh: { user: root }
    #   domain: "myapp.com"
    #   aliases: ["www.myapp.com"]   # extra domains (vhost + certificate when they resolve here)
    #   web_server: nginx            # nginx | apache (never both: an installed one wins)
    #   php_version: "8.4"
    #   # python_version: "3.13"     # next to the system python3 (Ubuntu: deadsnakes)
    #   # node_major: "24"
    #   doc_root: current/app        # relative to remote_path, e.g. current/app/public
    #   database: postgres           # postgres | mariadb | none
    #   db_name: myapp
    #   db_user: myapp_user
    #   db_password: ${DB_PASS}      # only for a new user: existing ones keep their password
    #   redis: true                  # or dragonfly: true (Redis-compatible; never both)
    #   # frankenphp: true           # PHP on FrankenPHP (a service behind nginx) instead of PHP-FPM
    #   ssl: true                    # certbot certonly + SSL vhost (needs DNS pointing here)
    #   # ssl_self_signed: true      # staging/LAN without public DNS: self-signed certificate
    #   ufw: true
    #   backup: true                 # daily dump to remote_path/backups; B = backup now
    #   backup_keep: 7
    #   # packages: [tesseract-ocr, poppler-utils]   # extra OS packages the app needs (base step)
    #   # cron:                      # run as deploy_user in current/app (/etc/cron.d/versa-<project>)
    #   #   - "* * * * * php versaCLI app:schedule:run >> versaWYS/logs/cron.log 2>&1"
    #   deploy_user: deploy          # default: ssh.user
    #   # proxy_port: 8000           # Python/Go/Node (or FrankenPHP) app behind the web server

    # HEALTH CHECK: Verify the application is responding after deployment.
    # If the check fails after retries, automatic rollback is triggered.
    # health_check:
    #   url: "https://myapp.com/health"
    #   expected_status: 200   # HTTP status code to expect (default: 200)
    #   command: "php artisan about" # And/or a command run on the server in the new release (exit 0 = healthy)
    #   timeout: 10            # Seconds to wait per request (default: 10)
    #   retries: 3             # Number of retry attempts (default: 3)
    #   retry_delay: 2         # Seconds between retries (default: 2)

    # NOTIFICATIONS: Send webhook on deploy success/failure (Slack, Teams, Discord, Telegram).
    # With on_failure, failures carry the log's last lines and the next success is sent
    # as "recovered" even with on_success: false.
    # notifications:
    #   webhook_url: "https://hooks.slack.com/services/xxx/yyy/zzz"
    #   on_success: true
    #   on_failure: true
    #   # Telegram: webhook_url: "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
    #   # chat_id: "-1001234567890"

    # LIMITS:
    hook_timeout: 300          # Kill hooks if they take more than 5 minutes
    # deploy_timeout: 600     # Maximum total deploy time in seconds

    # RELEASES & UPLOAD:
    # releases_to_keep: 5      # Releases kept on the server (rollback depth)
    # upload_workers: 4        # Parallel SFTP uploads
    # chunk_size_mb: 10        # Size of each uploaded archive chunk
    # incremental_upload: true # Upload only changed files over a hardlinked copy of the
    #                          # previous release. Hooks must not edit release files in place.

  # LOCAL DEPLOY: For hosting where SSH isn't available (shared hosting, etc.).
  # Instead of connecting over SSH, versaDeploy builds the project and writes a
  # full release to local_path/app (+ manifest.json, + bin/ for Go binaries).
  # Every deploy REPLACES local_path entirely — there is no release history,
  # no rollback, and no shared_paths/preserved_paths support in this mode.
  # Upload the contents of local_path/app to your hosting (FTP, file manager, etc.).
  # shared_hosting:
  #   local: true
  #   local_path: "./local-releases/shared-hosting" # never point this at a build tool's own output dir (e.g. frontend's "dist")
  #   builds:
  #     php:
  #       enabled: true
  #       composer_command: "composer install --no-dev --optimize-autoloader"
  #   post_deploy:
  #     - "php versaCLI cache:clear" # runs locally, cwd = local_path/app
