# Nuxt (Nitro node-server) as a service behind nginx. Tested end to end with Nuxt 4
# on Ubuntu 24.04 and AlmaLinux 9. .output/ bundles its own dependencies, so no
# node_modules goes to the server.
#
# Runtime config: NUXT_* variables in shared/.env (versa → Shared → Enter → e), then
# `versa service production restart`. NUXT_PUBLIC_* also work at runtime.
project: "mysite"                        # change

environments:
  production:
    ssh:
      host: "mysite.com"                 # change
      user: "deploy"
      key_path: "~/.ssh/id_ed25519"

    remote_path: "/var/www/mysite"

    provision:
      ssh: { user: root }
      domain: "mysite.com"               # change
      aliases: ["www.mysite.com"]
      web_server: nginx
      node_major: "22"
      proxy_port: 3000
      database: none
      ssl: true
      deploy_user: deploy
      # Optional: events and traffic peaks (doc/SERVICES.md, section 10)
      # timezone: America/Santiago
      # nginx:                              # traffic sharing an IP (event WiFi, mobile CGNAT)
      #   rate: "500r/s"
      #   burst: 2000
      #   worker_connections: 8192
      # tuning:                             # `versa tune` sizes the stack from CPU and RAM
      #   profile: event                    # off (default) | auto | small | event
      #   share: 100%                       # part of the server this project may use
      #   upload_max: 200M

    ignored_paths:
      - ".git"
      - ".github"
      - ".nuxt"
      - "node_modules"

    shared_paths:
      - ".env"

    builds:
      frontend:
        enabled: true
        npm_command: "npm ci"
        compile_command: "npm run build"
        # the build output: kept from the previous release when no frontend file changed
        reusable_paths: [".output"]

    services:
      - name: "mysite"
        exec: "node .output/server/index.mjs"
        env_file: ".env"
        environment:
          PORT: "3000"
          NODE_ENV: "production"
        # Optional: resources (doc/DEPLOY.md, Services)
        # open_files: 65536
        # memory_max: "2G"
        # cpu_weight: 100                   # lower it on heavy background work
        # nice: 0
        # graceful_stop: true               # finish requests in progress on deploys
        # stop_timeout: 60

    health_check:
      url: "https://mysite.com/"
