# Flask behind gunicorn and nginx. Tested end to end on Ubuntu 24.04 and AlmaLinux 9.
# requirements.txt must include flask and gunicorn; app.py defines `app = Flask(...)`.
# The virtualenv is created on the server (reused while requirements.txt doesn't change).
#
# Secrets: shared/.env, created from .env.example on the first deploy; edit it in
# versa → Shared → Enter → e, then `versa service production restart`.
project: "myapi"                         # change

environments:
  production:
    ssh:
      host: "api.example.com"            # change
      user: "deploy"
      key_path: "~/.ssh/id_ed25519"

    remote_path: "/var/www/myapi"

    provision:
      ssh: { user: root }
      domain: "api.example.com"          # change
      web_server: nginx
      proxy_port: 8000
      database: postgres                 # or mariadb / none
      db_name: myapi
      db_user: myapi_user
      db_password: "${DB_PASS}"
      ssl: true
      backup: true
      deploy_user: deploy

    ignored_paths:
      - ".git"
      - ".github"
      - "tests"
      - "__pycache__"
      - ".venv"

    shared_paths:
      - ".env"

    builds:
      python:
        enabled: true
        requirements_file: "requirements.txt"
        web_server: true
        web_framework: gunicorn          # run_server.sh: gunicorn app:app
        entry_point: "app.py"
        web_host: "127.0.0.1"            # only nginx reaches it
        web_port: 8000
        web_workers: 2

    services:
      - name: "myapi"                    # exec: the release's run_server.sh
        env_file: ".env"

    # post_deploy:
    #   - ".venv/bin/flask --app app db upgrade"   # Flask-Migrate

    health_check:
      url: "https://api.example.com/"
