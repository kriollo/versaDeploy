# Next.js (SSR) as a service behind nginx. Tested end to end with Next.js 16 on
# Ubuntu 24.04 and AlmaLinux 9. package.json needs "start": "next start".
#
# Runtime variables (server only): shared/.env, edited in versa → Shared → Enter → e,
# then `versa service production restart`. NEXT_PUBLIC_* are build-time: they come
# from your machine when versa builds.
project: "myshop"                        # change

environments:
  production:
    ssh:
      host: "myshop.com"                 # change
      user: "deploy"
      key_path: "~/.ssh/id_ed25519"

    remote_path: "/var/www/myshop"

    provision:
      ssh: { user: root }
      domain: "myshop.com"               # change
      aliases: ["www.myshop.com"]
      web_server: nginx
      node_major: "22"
      proxy_port: 3000                   # nginx → the service
      database: none                     # or postgres / mariadb
      ssl: true
      deploy_user: deploy
      # Optional: events and traffic peaks (doc/SERVICES.md, section 10)
      # timezone: America/Santiago
      # nginx:                              # traffic sharing an IP (event WiFi, mobile CGNAT)
      #   rate: "500r/s"
      #   burst: 2000
      #   worker_connections: 8192
      # tuning:                             # `versa tune` sizes the stack from CPU and RAM
      #   profile: event                    # off (default) | auto | small | event
      #   share: 100%                       # part of the server this project may use
      #   upload_max: 200M

    ignored_paths:
      - ".git"
      - ".github"
      - "node_modules/.cache"
      - ".next/cache"

    shared_paths:
      - ".env"                            # created from .env.example on the first deploy

    builds:
      frontend:
        enabled: true
        npm_command: "npm ci"
        compile_command: "NEXT_TELEMETRY_DISABLED=1 npm run build"
        # the build output: kept from the previous release when no frontend file changed
        reusable_paths: [".next"]
        # node_modules installed on the server: native modules (sharp…) for Linux.
        # Reused while package-lock.json doesn't change. Ship the lockfile.
        server_install: "npm ci --omit=dev"

    services:
      - name: "myshop"
        exec: "npm start"
        env_file: ".env"                 # <remote_path>/shared/.env
        environment:
          PORT: "3000"
          NODE_ENV: "production"
          NEXT_TELEMETRY_DISABLED: "1"
        # Optional: resources (doc/DEPLOY.md, Services)
        # open_files: 65536
        # memory_max: "2G"
        # cpu_weight: 100                   # lower it on heavy background work
        # nice: 0
        # graceful_stop: true               # finish requests in progress on deploys
        # stop_timeout: 60

    health_check:
      url: "https://myshop.com/"
