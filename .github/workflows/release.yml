name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (e.g. v0.9.0-beta). Mandatory for manual runs."
        required: true
        default: ""

# Least privilege: only the release job can write (create the release)
permissions:
  contents: read

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    # Manual releases only from the default branch
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # Disable cache for release matrix to avoid congestion errors

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          # The tag goes into -ldflags and the release name: refuse anything else
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$' || { echo "invalid tag: $TAG"; exit 1; }
          mkdir -p dist
          # Standardize naming: versa_linux_amd64, versa_windows_amd64.exe, etc.
          # The internal build name is just 'versa' or 'versa.exe' as requested
          RELEASE_NAME="versa_${{ matrix.goos }}_${{ matrix.goarch }}$([ "${{ matrix.goos }}" = "windows" ] && echo ".exe" || echo "")"

          go build -v -ldflags "-X github.com/user/versaDeploy/internal/version.Version=${TAG}" -o "dist/${RELEASE_NAME}" ./cmd/versa
          sha256sum "dist/${RELEASE_NAME}" > "dist/${RELEASE_NAME}.sha256"

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: versa-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          # Only generate notes automatically on real tag pushes
          generate_release_notes: ${{ github.event_name == 'push' }}
          draft: false
          # self-update reads /releases/latest, which skips prereleases: only tags
          # with a suffix (v1.2.0-beta) are prereleases
          prerelease: ${{ contains(github.event.inputs.tag_name || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
